name: Dependency lock refresh

on:
  push:
    branches:
      - agent/stage-00-dependency-hardening

permissions:
  contents: write

jobs:
  refresh-safe-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-00-dependency-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Commit safe lockfile refresh
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No safe dependency lock updates remain."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: apply non-breaking dependency security fixes"
          git push origin HEAD:agent/stage-00-dependency-hardening
