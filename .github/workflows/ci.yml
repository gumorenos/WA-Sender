name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://wa_sender:wa_sender_password@localhost:5432/wa_sender
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
  NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters
  AUTH_GOOGLE_ID: placeholder.apps.googleusercontent.com
  AUTH_GOOGLE_SECRET: placeholder-secret
  AUTH_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: 1
  REAL_SENDING_ENABLED: "false"
  MOCK_WHATSAPP_ENABLED: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wa_sender
          POSTGRES_PASSWORD: wa_sender_password
          POSTGRES_DB: wa_sender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wa_sender -d wa_sender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate migrations
        run: npm run db:deploy

      - name: Validate shell scripts
        run: |
          sh -n scripts/backup/backup.sh
          sh -n scripts/backup/backup-loop.sh
          sh -n scripts/backup/healthcheck.sh
          sh -n scripts/backup/restore.sh

      - name: Exercise backup freshness healthcheck
        run: |
          heartbeat="$(mktemp)"
          BACKUP_HEARTBEAT_FILE="$heartbeat" BACKUP_HEALTH_MAX_AGE_SECONDS=60 sh scripts/backup/healthcheck.sh
          touch -d '2 minutes ago' "$heartbeat"
          if BACKUP_HEARTBEAT_FILE="$heartbeat" BACKUP_HEALTH_MAX_AGE_SECONDS=60 sh scripts/backup/healthcheck.sh; then
            echo "Expected stale backup heartbeat to fail." >&2
            exit 1
          fi
          rm -f "$heartbeat"

      - name: Validate Compose configuration
        run: |
          docker compose -f docker-compose.local.yml config -q
          COMPOSE_ENV_FILE=.env.production.example \
            docker compose --env-file .env.production.example -f docker-compose.yml config -q

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Backup and restore round trip
        run: |
          backup_dir="$RUNNER_TEMP/wa-sender-backups"
          mkdir -p "$backup_dir"

          docker run --rm --network host \
            -e BACKUP_DIR=/backups \
            -e BACKUP_HEARTBEAT_FILE=/backups/.heartbeat \
            -e POSTGRES_APP_HOST=127.0.0.1 \
            -e POSTGRES_APP_PORT=5432 \
            -e POSTGRES_USER=wa_sender \
            -e POSTGRES_PASSWORD=wa_sender_password \
            -e POSTGRES_DB=wa_sender \
            -e POSTGRES_EVOLUTION_HOST=127.0.0.1 \
            -e POSTGRES_EVOLUTION_PORT=5432 \
            -e EVOLUTION_POSTGRES_USER=wa_sender \
            -e EVOLUTION_POSTGRES_PASSWORD=wa_sender_password \
            -e EVOLUTION_POSTGRES_DB=wa_sender \
            -v "$PWD/scripts/backup:/scripts:ro" \
            -v "$backup_dir:/backups" \
            postgres:16-alpine sh /scripts/backup.sh

          dump_file="$(find "$backup_dir" -type f -name wa_sender_app.dump | head -n 1)"
          test -n "$dump_file"
          test -f "$dump_file.sha256"
          test -f "$backup_dir/.heartbeat"

          docker run --rm --network host \
            -e PGPASSWORD=wa_sender_password \
            postgres:16-alpine createdb \
            -h 127.0.0.1 -p 5432 -U wa_sender wa_sender_restore

          relative_dump="${dump_file#${backup_dir}/}"
          docker run --rm --network host \
            -e PGPASSWORD=wa_sender_password \
            -v "$PWD/scripts/backup:/scripts:ro" \
            -v "$backup_dir:/backups:ro" \
            postgres:16-alpine sh /scripts/restore.sh \
            "/backups/$relative_dump" 127.0.0.1 wa_sender_restore wa_sender 5432

          docker run --rm --network host \
            -e PGPASSWORD=wa_sender_password \
            postgres:16-alpine psql \
            -h 127.0.0.1 -p 5432 -U wa_sender -d wa_sender_restore \
            -v ON_ERROR_STOP=1 \
            -c 'SELECT COUNT(*) FROM users;' \
            -c 'SELECT COUNT(*) FROM campaigns;'

      - name: Build Docker image
        run: docker build --tag wa-sender-ci:${{ github.sha }} .

      - name: Smoke Docker image runtime
        run: |
          image="wa-sender-ci:${{ github.sha }}"
          configured_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
          if [ "$configured_user" != "node" ]; then
            echo "Expected runtime image user 'node', got '$configured_user'." >&2
            exit 1
          fi

          container_id="$(docker run -d --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOSTNAME=127.0.0.1 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e AUTH_SECRET="$AUTH_SECRET" \
            -e NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            -e AUTH_GOOGLE_ID="$AUTH_GOOGLE_ID" \
            -e AUTH_GOOGLE_SECRET="$AUTH_GOOGLE_SECRET" \
            -e AUTH_URL="$AUTH_URL" \
            -e NEXTAUTH_URL="$NEXTAUTH_URL" \
            -e REAL_SENDING_ENABLED=false \
            -e MOCK_WHATSAPP_ENABLED=true \
            "$image")"

          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/health/ready \
              --output "$RUNNER_TEMP/readiness.json"; then
              ready=true
              break
            fi

            if [ "$(docker inspect "$container_id" --format '{{.State.Running}}')" != "true" ]; then
              echo "Runtime container exited before becoming ready." >&2
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "Runtime image did not become ready within 30 seconds." >&2
            exit 1
          fi

          cat "$RUNNER_TEMP/readiness.json"
