name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://wa_sender:wa_sender_password@localhost:5432/wa_sender
  AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
  NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters
  AUTH_GOOGLE_ID: placeholder.apps.googleusercontent.com
  AUTH_GOOGLE_SECRET: placeholder-secret
  AUTH_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: 1
  REAL_SENDING_ENABLED: "false"
  MOCK_WHATSAPP_ENABLED: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wa_sender
          POSTGRES_PASSWORD: wa_sender_password
          POSTGRES_DB: wa_sender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wa_sender -d wa_sender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/stage-00-dependency-hardening' && github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync declared dependency changes to lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/stage-00-dependency-hardening'
        run: npm install --package-lock-only

      - name: Apply non-breaking audit fixes to lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/stage-00-dependency-hardening'
        shell: bash
        run: npm audit fix --package-lock-only || true

      - name: Commit dependency lock refresh
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/stage-00-dependency-hardening'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency lock updates remain."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:agent/stage-00-dependency-hardening

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit diagnostic
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
